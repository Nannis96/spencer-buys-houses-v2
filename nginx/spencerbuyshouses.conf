# Plantilla: no está comparada con la configuración actual del VPS.
# Verifica rutas de certificados, puerto y otros location antes de aplicarla.

# HTTP (con y sin www) -> https://www
server {
    listen 80;
    listen [::]:80;
    server_name spencerbuyshouses.com www.spencerbuyshouses.com;
    return 301 https://www.spencerbuyshouses.com$request_uri;
}

# HTTPS sin www -> https://www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name spencerbuyshouses.com;

    ssl_certificate     /etc/letsencrypt/live/spencerbuyshouses.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spencerbuyshouses.com/privkey.pem;

    return 301 https://www.spencerbuyshouses.com$request_uri;
}

# Sitio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.spencerbuyshouses.com;

    ssl_certificate     /etc/letsencrypt/live/spencerbuyshouses.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spencerbuyshouses.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
